name: Publish to GitHub Packages

on:
  push:
    branches:
      - '*'  # Trigger on push to main branch

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required to upload to GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Publish package
        run: mvn deploy # Use ./gradlew publish for Gradle projects
        env:
            # Authenticates with the GITHUB_TOKEN to publish to GitHub Packages
            GITHUB_TOKEN: ${{ secrets.parent-artifact-publish }}