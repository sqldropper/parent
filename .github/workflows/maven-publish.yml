name: Trigger GitHub Actions CI
on:
  push:
    branches:
      - '*'
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger workflow
        run: |
          gh workflow run parent-ci.yml \
            --repo sqldropper/github-actions \
            -f repo-url=${{ github.repository }} \
            -f branch=${{ github.ref_name }}